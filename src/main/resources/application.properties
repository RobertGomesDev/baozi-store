spring.application.name=baozi-store
server.port=8080

# ===== Banco H2 (padrão) - salva os dados na pasta ./data =====
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Para usar MySQL, comente o bloco acima e descomente este =====
#spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
#spring.datasource.username=root
#spring.datasource.password=SUA_SENHA

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
